version: 2

# One PR per ecosystem, not one per package: every bump (root + website, minor/patch AND major)
# lands in a single grouped weekly PR — Dependabot keeps version updates and security updates in
# separate groups by design (`applies-to`), and never mixes ecosystems.
#
# Direct dependencies only (`allow`, which also governs security updates): transitive
# vulnerabilities are left to upstream — most of the PR noise was lockfile-only security bumps
# of packages we don't depend on directly (postcss, nanoid, qs, …). Dependabot ALERTS still
# open for them; only the automatic PRs stop.
updates:
  # Node dependencies (npm / package.json) — root package + the Docusaurus docs site
  - package-ecosystem: npm
    directories:
      - "/"
      - "/website"
    # Bump the requirement in package.json alongside the lockfile (keeps the ^caret style), so the
    # manifest and the lock never drift — the default for a published library only widens ranges.
    versioning-strategy: increase
    target-branch: develop # the integration branch; main only receives releases
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Rome"
    allow:
      - dependency-type: direct
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop # the integration branch; main only receives releases
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Rome"
    allow:
      - dependency-type: direct
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
