version: 2

# One PR per ecosystem, not one per package: every npm bump (root + website, minor/patch AND
# major) lands in a single grouped PR, and security bumps land in a single grouped PR of their
# own — Dependabot keeps version updates and security updates in separate groups by design
# (`applies-to`), and never mixes ecosystems.
updates:
  # Node dependencies (npm / package.json) — root package + the Docusaurus docs site
  - package-ecosystem: npm
    directories:
      - "/"
      - "/website"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Rome"
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Rome"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
