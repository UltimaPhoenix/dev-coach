name: Docs

# Two versions of the site from one GitHub Pages deployment:
#   • main    → https://ultimaphoenix.github.io/dev-coach/       (released docs)
#   • develop → https://ultimaphoenix.github.io/dev-coach/next/  (unreleased: noindex, no sitemap, banner)
# Both branches are rebuilt whichever one triggered the run, so the deployment is always complete.
on:
  push:
    branches: [main, develop]
    paths: ["docs/**", "website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: next
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: release/.node-version
          cache: npm
          cache-dependency-path: |
            release/website/package-lock.json
            next/website/package-lock.json
      - name: Build the released docs (main)
        working-directory: release/website
        run: npm ci && npm run build
      # The Docusaurus build only transpiles, so tsc is what type-checks the site's TS/TSX.
      # develop only: main only ever receives release commits of develop, already checked here.
      - name: Type-check + build the next docs (develop) under /next/
        working-directory: next/website
        env:
          DOCS_NEXT: "1"
        run: npm ci && npm run typecheck && npm run build
      - run: cp -r next/website/build release/website/build/next
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
