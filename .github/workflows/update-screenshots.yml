name: Update documentation screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Admin PAT so the screenshots commit can push to the protected branch it was
          # dispatched on — run it on develop (the default GITHUB_TOKEN bot is blocked by the
          # required CLA check). The commit message already carries [skip ci], so this push
          # doesn't re-trigger CI (nor a canary).
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # The docs site's share page is captured from the site build (website/build/lesson.html).
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      # Playwright is a maintenance-only tool — installed ad hoc so it stays out of package.json.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      # The README's demo GIF, recorded from the docs home's terminal demo (ffmpeg ships with the runner).
      - run: node scripts/demo-gif.mjs
      - name: Commit refreshed screenshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git diff --staged --quiet && echo "No screenshot changes." || (
            git commit -m "docs: update screenshots [skip ci]" &&
            git push
          )
